syntax = "proto3";

package aiagent;

service AIAgentService {
  rpc GenerateReport (EmailAnalysisRequest) returns (AnalysisReport);
}

// ─── Rule Hit — مبعوت من الـ Rule Engine ─────────────────────────────────────
message RuleHit {
  string rule        = 1;
  float  score       = 2;
  string description = 3;
}

// ─── Request ──────────────────────────────────────────────────────────────────
message EmailAnalysisRequest {
  // Email content
  string email_id        = 1;
  string subject         = 2;
  string from_addr       = 3;
  string from_name       = 4;
  string body_text       = 5;

  // Rule Engine output — الـ AI بيبني عليهم مش بيشتغل من الصفر
  float  spam_score      = 6;
  float  phishing_score  = 7;
  bool   is_spam         = 8;
  bool   is_phishing     = 9;
  repeated RuleHit rule_hits = 10;

  // Malware Engine output
  bool   has_attachment    = 11;
  string malware_verdict   = 12;
  float  malware_score     = 13;
  string malware_severity  = 14;

  // Sender history — للـ Behavioral Anomaly Detection
  int32  mailbox_id              = 15;
  int32  previous_email_count    = 16;  // كام email من نفس الـ sender قبل كده
  string sender_typical_topic    = 17;  // "newsletter" | "invoice" | "unknown"
}

// ─── Response ─────────────────────────────────────────────────────────────────
message AnalysisReport {
  string email_id    = 1;

  // Feature 1 — Final Verdict
  string verdict     = 2;  // "SAFE" | "SUSPICIOUS" | "DANGEROUS"
  string severity    = 3;  // "LOW" | "MEDIUM" | "HIGH" | "CRITICAL"
  float  confidence  = 4;  // 0.0 → 1.0

  // Feature 2 — Human Explanation (ليه الإيميل خطر؟)
  string explanation = 5;

  // Feature 3 — Email Summary (سطرين)
  string summary     = 6;

  // Feature 4 — Smart Reply Suggestions
  repeated string reply_suggestions = 7;

  // Feature 5 — Campaign Detection
  bool   is_campaign           = 8;
  string campaign_description  = 9;

  // Feature 6 — Priority Scoring
  string priority        = 10;  // "URGENT" | "NORMAL" | "LOW" | "NEWSLETTER"
  string priority_reason = 11;

  // Feature 7 — Behavioral Anomaly
  bool   behavioral_anomaly  = 12;
  string anomaly_description = 13;

  // Recommendation
  string recommendation = 14;
}
