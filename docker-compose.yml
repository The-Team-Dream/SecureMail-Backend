services:
  postgres:
    image: postgres:16-alpine
    container_name: securemail-db-standalone
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0000"
      POSTGRES_DB: securemail
    ports:
      - "5432:5432"
    volumes:
      - securemail_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - securemail-standalone-net

  redis:
    image: redis:7-alpine
    container_name: securemail-redis-standalone
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - securemail-standalone-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securemail-backend-standalone
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - securemail-standalone-net

volumes:
  securemail_pg_data:

networks:
  securemail-standalone-net:
    driver: bridge
